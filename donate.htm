	<main>
		<h2>Donation Form</h2>
	<form>

<fieldset>
    <legend>Title</legend>

    <input type="radio" id="mr" name="title" value="Mr." required>
    <label for="mr">Mr.</label>

    <input type="radio" id="mrs" name="title" value="Mrs.">
    <label for="mrs">Mrs.</label>

    <input type="radio" id="ms" name="title" value="Ms.">
    <label for="ms">Ms.</label>

    <input type="radio" id="mx" name="title" value="Mx.">
    <label for="mx">Mx.</label>
</fieldset>

<label for="firstName">First Name:</label>
<input type="text" id="firstName" name="firstName" required>

<label for="lastName">Last Name:</label>
<input type="text" id="lastName" name="lastName" required>

<label for="email">Email Address:</label>
<input type="email" id="email" name="email" required>

<label for="date">Date:</label>
<input type="date" id="date" name="date" required>

<label for="phoneType">Phone Type:</label>
<select id="phoneType" name="phoneType" required>
    <option value="">Select Phone Type</option>
    <option value="Mobile">Mobile</option>
    <option value="Home">Home</option>
    <option value="Work">Work</option>
</select>

<label for="phoneNumber">Phone Number:</label>
<input type="tel" id="phoneNumber" name="phoneNumber" required>

<label for="price">Price ($):</label>
<input type="number" id="price" name="price" min="1" step="0.01" required>

<label for="cardNumber">Credit Card Number (Demo Only):</label>
<input type="text" id="cardNumber" name="cardNumber"
placeholder="Use test information only" required>

<label for="securityCode">Security Code (Demo Only):</label>
<input type="text" id="securityCode" name="securityCode"
placeholder="Test code only" required>

<input type="checkbox" id="terms" name="terms" required>
<label for="terms">I agree to the terms and conditions.</label>

<input type="submit" value="Submit Donation">



	</form>

	</main>
